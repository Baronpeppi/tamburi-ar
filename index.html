<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tamburi Standort AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f4f5;color:#1f2328}
header{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#666;margin-top:4px}
.panel{background:#fff;padding:12px 14px;border-bottom:1px solid #ddd}
.label{font-size:12px;font-weight:700;margin:0 0 6px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.choice{border:1px solid #bbb;background:#fff;border-radius:9px;padding:9px 12px;font-size:14px}
.choice.active{background:#202124;color:#fff;border-color:#202124}
.choice:disabled{opacity:.35}
#status{font-size:12px;color:#555;min-height:16px}
model-viewer{width:100%;height:calc(100vh - 300px);min-height:420px;background:linear-gradient(#fafafa,#e6e8ea)}
#arButton{background:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 3px 15px #0003;position:absolute;bottom:22px;left:50%;transform:translateX(-50%)}
.badge{position:absolute;top:12px;left:12px;background:#ffffffdf;border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:0 2px 8px #0002}
.note{font-size:11px;color:#777;margin-top:-5px}
</style>
</head>
<body>
<header>
  <h1>Tamburi Standort AR</h1>
  <div class="sub">Paketkasten auswählen und maßstabsgetreu in der Umgebung anzeigen</div>
</header>

<div class="panel">
  <div class="label">1. Anzahl Kästen</div>
  <div class="row" id="countRow">
    <button class="choice active" data-count="1">1 Kasten</button>
    <button class="choice" data-count="2">2 Kästen</button>
    <button class="choice" data-count="3">3 Kästen</button>
  </div>

  <div class="label">2. Aufstellung</div>
  <div class="row" id="baseRow">
    <button class="choice active" data-base="normal">Normal</button>
    <button class="choice" data-base="sockel">Betonsockel</button>
  </div>

  <div class="label">3. Betonplatten vor dem Kasten</div>
  <div class="row" id="plateRow">
    <button class="choice active" data-plates="none">Keine</button>
    <button class="choice" data-plates="50">50 cm tief</button>
    <button class="choice" data-plates="100">100 cm tief</button>
  </div>
  <div class="note">50 cm = 2 Platten je Kasten · 100 cm = 4 Platten je Kasten</div>
  <div id="status"></div>
</div>

<model-viewer id="viewer"
 src="normal_1.glb"
 alt="Tamburi Paketkasten"
 camera-controls touch-action="pan-y"
 ar ar-modes="webxr scene-viewer"
 ar-scale="fixed"
 shadow-intensity="1" shadow-softness=".8"
 exposure="1" environment-image="neutral">
 <div class="badge" id="badge">1 Kasten · Normal · keine Platten</div>
 <button slot="ar-button" id="arButton">📷 In Umgebung anzeigen</button>
</model-viewer>

<script>
const viewer=document.getElementById('viewer');
const badge=document.getElementById('badge');
const status=document.getElementById('status');
let state={count:1,base:'normal',plates:'none'};

function setActive(group, attr, val){
 document.querySelectorAll(group+' .choice').forEach(b=>b.classList.toggle('active',b.dataset[attr]===String(val)));
}
function update(){
 // Current model library has separate "sockel" and "platten" GLBs.
 // Until combined sockel+platten models exist, selecting plates switches to normal mounting.
 if(state.base==='sockel' && state.plates!=='none'){
   state.plates='none';
   setActive('#plateRow','plates','none');
   status.textContent='Betonsockel und Betonplatten werden derzeit getrennt dargestellt.';
 } else status.textContent='';

 let src,desc;
 if(state.base==='sockel'){
   src=`sockel_${state.count}.glb`;
   desc=`${state.count} ${state.count===1?'Kasten':'Kästen'} · Betonsockel · keine Platten`;
 } else if(state.plates==='50'){
   src=`platten50_${state.count}.glb`;
   desc=`${state.count} ${state.count===1?'Kasten':'Kästen'} · 50 cm Betonplatten`;
 } else if(state.plates==='100'){
   src=`platten100_${state.count}.glb`;
   desc=`${state.count} ${state.count===1?'Kasten':'Kästen'} · 100 cm Betonplatten`;
 } else {
   src=`normal_${state.count}.glb`;
   desc=`${state.count} ${state.count===1?'Kasten':'Kästen'} · Normal · keine Platten`;
 }
 viewer.src=src; badge.textContent=desc;
}

document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{
 state.count=Number(b.dataset.count); setActive('#countRow','count',state.count); update();
});
document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{
 state.base=b.dataset.base; setActive('#baseRow','base',state.base);
 if(state.base==='sockel'){state.plates='none';setActive('#plateRow','plates','none');}
 update();
});
document.querySelectorAll('[data-plates]').forEach(b=>b.onclick=()=>{
 state.plates=b.dataset.plates; setActive('#plateRow','plates',state.plates);
 if(state.plates!=='none'){state.base='normal';setActive('#baseRow','base','normal');}
 update();
});
</script>
</body>
</html>
