<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tamburi AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background:#f4f4f4; color:#222; }
    header { padding:14px 16px 8px; background:#fff; position:sticky; top:0; z-index:5; box-shadow:0 1px 6px #0002; }
    h1 { font-size:20px; margin:0 0 10px; }
    .buttons { display:flex; gap:8px; flex-wrap:wrap; }
    button {
      border:1px solid #bbb; background:#fff; border-radius:10px; padding:10px 14px;
      font-size:15px; cursor:pointer;
    }
    button.active { background:#222; color:#fff; border-color:#222; }
    .info { font-size:13px; margin-top:8px; color:#555; }
    model-viewer {
      width:100%; height:calc(100vh - 130px); min-height:520px;
      background:linear-gradient(#fafafa,#e9e9e9);
      --poster-color: transparent;
    }
    .ar-button {
      background:#fff; border-radius:999px; border:1px solid #bbb; position:absolute;
      bottom:24px; left:50%; transform:translateX(-50%);
      padding:14px 20px; font-weight:700; box-shadow:0 3px 14px #0003;
    }
    .hint {
      position:absolute; top:14px; left:50%; transform:translateX(-50%);
      background:#ffffffdd; padding:8px 12px; border-radius:10px; font-size:13px;
      box-shadow:0 2px 8px #0002; text-align:center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tamburi Paketkasten – AR</h1>
    <div class="buttons">
      <button class="active" data-src="tamburi_1_kasten.glb" data-label="1 Kasten · 120 × 65 × 225 cm">1 Kasten</button>
      <button data-src="tamburi_2_kaesten.glb" data-label="2 Kästen · 220 × 65 × 225 cm">2 Kästen</button>
      <button data-src="tamburi_3_kaesten.glb" data-label="3 Kästen · 320 × 65 × 225 cm">3 Kästen</button>
    </div>
    <div class="info" id="info">1 Kasten · 120 × 65 × 225 cm</div>
  </header>

  <model-viewer id="viewer"
    src="tamburi_1_kasten.glb"
    alt="Tamburi Paketkasten"
    camera-controls
    touch-action="pan-y"
    ar
    ar-modes="webxr scene-viewer"
    ar-scale="fixed"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral">
      <div class="hint">Modell prüfen und dann „In Umgebung anzeigen“ wählen.</div>
      <button slot="ar-button" class="ar-button">📷 In Umgebung anzeigen</button>
  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');
    const info = document.getElementById('info');
    document.querySelectorAll('[data-src]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-src]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        viewer.src = btn.dataset.src;
        info.textContent = btn.dataset.label;
      });
    });
  </script>
</body>
</html>
