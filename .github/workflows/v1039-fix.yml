name: Tamburi-v10-39-fix
on:
  push:
    paths:
      - '.github/workflows/v1039-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('v10.38','v10.39'); s=s.replace('const drawW=W*desktopS;\n      const drawH=H*desktopS;\n      const cx=W/2 + desktopX*mapX;\n      const cy=H/2 + desktopY*mapY;', 'const stageRect=stage.getBoundingClientRect();\n      const viewerRect=viewer.getBoundingClientRect();\n      const drawW=viewerRect.width*mapX;\n      const drawH=viewerRect.height*mapY;\n      const drawX=(viewerRect.left-stageRect.left)*mapX;\n      const drawY=(viewerRect.top-stageRect.top)*mapY;'); s=s.replace('cx-drawW/2,cy-drawH/2,drawW,drawH','drawX,drawY,drawW,drawH'); p.write_text(s)"
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git commit -m 'v10.39 fix desktop preview export alignment'
          git push
