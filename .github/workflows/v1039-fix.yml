name: Apply Tamburi v10.39 desktop preview export fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v1039-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<title>Tamburi Standort AR v10.38</title>', '<title>Tamburi Standort AR v10.39</title>'),
              ('>v10.38</span></h1>', '>v10.39</span></h1>'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s = s.replace(old, new, 1)
          old = '''      // v10.38: Export exakt wie CSS-Vorschau skalieren – auch bei sehr kleinem Kasten.
      const drawW=W*desktopS;
      const drawH=H*desktopS;
      const cx=W/2 + desktopX*mapX;
      const cy=H/2 + desktopY*mapY;

      ctx.drawImage(
        bmp,0,0,bmp.width,bmp.height,
        cx-drawW/2,cy-drawH/2,drawW,drawH
      );'''
          new = '''      // v10.39: Exportposition direkt aus dem sichtbaren Viewer-Rechteck.
      const stageRect=stage.getBoundingClientRect();
      const viewerRect=viewer.getBoundingClientRect();
      const drawW=viewerRect.width*mapX;
      const drawH=viewerRect.height*mapY;
      const drawX=(viewerRect.left-stageRect.left)*mapX;
      const drawY=(viewerRect.top-stageRect.top)*mapY;

      ctx.drawImage(
        bmp,0,0,bmp.width,bmp.height,
        drawX,drawY,drawW,drawH
      );'''
          if old not in s:
              raise SystemExit('Expected v10.38 export block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          readme = "Tamburi AR v10.39 – Desktop Preview = Export\n\nÄnderung:\n- Export übernimmt das tatsächlich sichtbare Viewer-Rechteck der Desktop-Vorschau.\n- Behebt den vertikalen Versatz bei stark verkleinertem Kasten.\n- Andere Funktionen bleiben unverändert.\n"
          Path('README.txt').write_text(readme, encoding='utf-8')
          PY
      - name: Commit v10.39
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.txt
          git diff --cached --quiet && exit 0
          git commit -m "v10.39 fix desktop preview export alignment"
          git push
