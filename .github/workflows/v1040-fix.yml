name: Tamburi-v10-40-direct-preview-fix
on:
  push:
    paths:
      - '.github/workflows/v1040-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop preview export
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('v10.39','v10.40'); s=s.replace('const bgFit=Math.max(W/iw,H/ih);','const bgFit=Math.min(W/iw,H/ih);',1); s=s.replace('// Hintergrund exakt wie in der 4:3-Desktopvorschau.','// v10.40: Hintergrund exakt wie sichtbar in der Desktop-Vorschau (object-fit: contain).',1); p.write_text(s)"
      - name: Commit v10.40
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v10.40 fix desktop preview background mapping"
          git push
